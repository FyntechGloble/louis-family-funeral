<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b35"><link rel="manifest" href="/manifest.webmanifest"><title>Louis Brown | Family Funeral Planner</title><style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:#f6f5f1;color:#24333a}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#162c36;color:#fff;padding:19px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;font-size:24px}small,.muted{color:#64747c}.sub{color:#b5c4c7;font-size:12px;margin-top:3px}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.hero{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 35px #1b30330e;margin-bottom:20px;border-left:5px solid #b4945b}.hero h1{font-family:Georgia,serif;font-size:30px;font-weight:500;margin:2px 0 8px}.hero p{margin:0;color:#64747c}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button{border:1px solid #dfe3e2;background:#fff;color:#334b54;border-radius:10px;padding:11px 15px;font-weight:600}.nav button.active{background:#1c3b44;color:#fff;border-color:#1c3b44}.card{background:white;border:1px solid #e6eae8;border-radius:16px;padding:21px;margin-bottom:16px;box-shadow:0 3px 16px #17293308}.card h2{margin:0 0 17px;font-family:Georgia,serif;font-weight:500;color:#253d46}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:17px;background:#f4f7f5;border-radius:12px}.stat strong{font-size:26px;display:block;color:#1e3b43}.stat span{font-size:13px;color:#60747a}.task{display:grid;grid-template-columns:28px 1fr minmax(100px,180px);align-items:start;gap:12px;padding:13px 0;border-top:1px solid #edf0ee}.task:first-child{border-top:0}.task input[type=checkbox]{width:20px;height:20px;accent-color:#1b5150;margin-top:2px}.task.done .task-title{text-decoration:line-through;color:#94a1a3}.task-title{font-weight:550}.task select{width:100%}.task textarea{width:100%;margin-top:7px;min-height:44px}.group h3{margin:0 0 8px;font-size:17px}.group{margin-bottom:22px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}.field input,.field select,.field textarea,input,textarea,select{border:1px solid #ccd7d5;background:#fff;border-radius:9px;padding:10px;max-width:100%}.field input,.field textarea{width:100%}.field textarea{min-height:85px}.primary{background:#1a4449;color:#fff;border:none;border-radius:9px;padding:11px 16px}.secondary{background:#ebf1ef;color:#1a4449;border:none;border-radius:9px;padding:10px 13px}.danger{color:#9a3542}.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.budgetrow{display:grid;grid-template-columns:1.7fr 1fr 1fr 75px;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #ecf0ef}.budgetrow input[type=number]{width:100%}.alert{border-radius:10px;padding:12px;background:#eaf3ec;color:#275740;margin:10px 0}.error{background:#feecec;color:#9b2222}.login{max-width:420px;margin:9vh auto;padding:26px}.login input{width:100%;display:block;margin:8px 0 15px}.tag{font-size:12px;background:#e8efed;padding:5px 8px;border-radius:6px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:11px 7px;border-bottom:1px solid #e9eeee;font-size:14px}.hidden{display:none}.footer{text-align:center;color:#8b999c;padding:20px}.progress{height:10px;background:#e6eeeb;border-radius:8px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#b09460}.tiny{font-size:12px}.save{color:#2b665a;font-size:12px;min-width:28px}@media(max-width:680px){.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.task{grid-template-columns:25px 1fr}.task select{grid-column:2}.budgetrow{grid-template-columns:1.2fr 1fr 1fr}.budgetrow input[type=checkbox]{grid-column:2}.brand{font-size:20px}.hero h1{font-size:25px}.wrap{padding:15px 12px 40px}}
</style></head><body><div id="app"></div><script>
const el=document.getElementById('app');let state=null,tab='overview',filter='all';let message='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'R '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
async function req(path,opts={}){let r=await fetch('/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function load(){try{state=await req('/state');render()}catch(e){state=null;renderLogin()}}
function notify(t,bad=false){message=t;let n=document.getElementById('notify');if(n){n.textContent=t;n.className='alert'+(bad?' error':'');n.classList.remove('hidden')}}
function renderLogin(){el.innerHTML=`<div class="card login"><h1 style="font-family:Georgia,serif">Louis Brown</h1><p class="muted">Private family funeral planner · Sign in</p><div id="err"></div><form id="login"><label>Email address</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%">Sign in</button></form><p class="muted tiny">Only invited family members can access this app. Contact the family administrator for an account.</p></div>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await req('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});load()}catch(err){document.getElementById('err').innerHTML='<div class="alert error">'+esc(err.message)+'</div>'}}}
function nav(t,name){return `<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${name}</button>`}
function render(){if(!state)return renderLogin();let me=state.me,done=state.tasks.filter(x=>x.done).length;el.innerHTML=`<header><div><div class="brand">✦ Louis Brown</div><div class="sub">Family remembrance & funeral arrangements</div></div><div class="line"><span class="tiny">${esc(me.name)}</span><button class="secondary" onclick="logout()">Sign out</button></div></header><main class="wrap"><section class="hero"><h1>Remembering Dad, together.</h1><p>A private place for our family to organise the arrangements and support one another.</p></section><nav class="nav">${nav('overview','Overview')}${nav('tasks','Checklists')}${nav('arrangements','Service details')}${nav('budget','Budget')}${nav('family','Family & access')}${nav('activity','Recent updates')}</nav><div id="notify" class="hidden"></div><section id="content"></section></main><div class="footer">With love, the Brown family · Private family workspace</div>`;let c=document.getElementById('content');if(tab==='overview')c.innerHTML=overview();if(tab==='tasks')c.innerHTML=tasks();if(tab==='arrangements')c.innerHTML=arrangements();if(tab==='budget')c.innerHTML=budget();if(tab==='family')c.innerHTML=family();if(tab==='activity')c.innerHTML=activity();}
function overview(){let d=state.tasks.filter(x=>x.done).length,t=state.tasks.length,ass=state.tasks.filter(x=>x.assignee===state.me.id&&!x.done);return `<div class="stats"><div class="stat"><strong>${Math.round(d/t*100)||0}%</strong><span>Checklist completed</span></div><div class="stat"><strong>${t-d}</strong><span>Tasks remaining</span></div><div class="stat"><strong>${ass.length}</strong><span>My open tasks</span></div></div><div class="card" style="margin-top:16px"><h2>Family progress</h2><div class="progress"><div style="width:${d/t*100||0}%"></div></div><p class="muted">${d} of ${t} tasks completed</p><button class="primary" onclick="tab='tasks';filter='mine';render()">View my tasks</button></div><div class="card"><h2>Confirmed service details</h2>${['Funeral date','Service time','Church / venue','Pastor','Funeral director','Reception venue'].map(k=>`<p><b>${esc(k)}:</b> ${esc(state.settings[k]||'To be confirmed')}</p>`).join('')}<button class="secondary" onclick="tab='arrangements';render()">Edit arrangements</button></div>`}
function tasks(){let can=state.me.role!=='viewer',members=state.users;let list=state.tasks.filter(x=>filter==='all'||(filter==='mine'?x.assignee===state.me.id:filter==='open'?!x.done:x.category===filter));let cat=[...new Set(state.tasks.map(t=>t.category))];return `<div class="card"><h2>Shared checklists</h2><div class="line"><select onchange="filter=this.value;render()"><option value="all">All tasks</option><option value="mine" ${filter==='mine'?'selected':''}>Assigned to me</option><option value="open" ${filter==='open'?'selected':''}>Open only</option>${cat.map(x=>`<option ${filter===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><span class="muted tiny">Changes are shared with the whole family</span></div></div>${cat.map(category=>{let matches=list.filter(t=>t.category===category);return matches.length?`<div class="card group"><h3>${esc(category)} <span class="tag">${matches.filter(x=>x.done).length}/${matches.length}</span></h3>${matches.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} ${!can?'disabled':''} onchange="patchTask(${t.id},{done:this.checked})"><div><div class="task-title">${esc(t.title)}</div><textarea aria-label="Notes" placeholder="Notes / next steps" ${!can?'disabled':''} onchange="patchTask(${t.id},{notes:this.value})">${esc(t.notes)}</textarea></div><select ${!can?'disabled':''} onchange="patchTask(${t.id},{assignee:this.value?Number(this.value):null})"><option value="">Unassigned</option>${members.map(u=>`<option value="${u.id}" ${t.assignee===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`).join('')}</div>`:''}).join('')}${can?`<div class="card"><h2>Add a task</h2><form onsubmit="addTask(event)" class="formgrid"><div class="field"><label>Task description</label><input name="title" required minlength="2"></div><div class="field"><label>Category</label><select name="category">${cat.map(x=>`<option>${esc(x)}</option>`).join('')}<option>Other</option></select></div><button class="primary">Add task</button></form></div>`:''}`}
function arrangements(){let can=state.me.role!=='viewer';return `<div class="card"><h2>Funeral & service details</h2><p class="muted">Fill in confirmed information. Blank fields mean the decision is still pending.</p><div class="formgrid">${Object.entries(state.settings).map(([k,v])=>`<div class="field"><label>${esc(k)}</label>${k==='Notes'?`<textarea ${!can?'disabled':''} onchange="saveSetting(${JSON.stringify(k)},this.value)">${esc(v)}</textarea>`:`<input ${!can?'disabled':''} value="${esc(v)}" onchange="saveSetting(${JSON.stringify(k)},this.value)">`}</div>`).join('')}</div><p class="muted tiny">Information saves when you finish editing each field.</p><button class="secondary" onclick="copyDetails()">Copy arrangements for WhatsApp</button></div>`}
function budget(){let can=state.me.role!=='viewer',estimated=state.expenses.reduce((a,x)=>a+x.estimate,0),actual=state.expenses.reduce((a,x)=>a+x.actual,0);return `<div class="stats"><div class="stat"><strong style="font-size:19px">${money(estimated)}</strong><span>Estimated</span></div><div class="stat"><strong style="font-size:19px">${money(actual)}</strong><span>Actual cost</span></div><div class="stat"><strong style="font-size:19px">${money(state.expenses.filter(x=>x.paid).reduce((a,x)=>a+x.actual,0))}</strong><span>Marked paid</span></div></div><div class="card" style="margin-top:16px"><h2>Expense tracker</h2><div class="budgetrow tiny"><b>Item</b><b>Estimate (R)</b><b>Actual (R)</b><b>Paid</b></div>${state.expenses.map(e=>`<div class="budgetrow"><b class="tiny">${esc(e.title)}</b><input aria-label="Estimate for ${esc(e.title)}" type="number" min="0" step="0.01" value="${e.estimate}" ${!can?'disabled':''} onchange="saveExpense(${e.id},{estimate:Number(this.value)})"><input aria-label="Actual for ${esc(e.title)}" type="number" min="0" step="0.01" value="${e.actual}" ${!can?'disabled':''} onchange="saveExpense(${e.id},{actual:Number(this.value)})"><input aria-label="Paid for ${esc(e.title)}" type="checkbox" ${e.paid?'checked':''} ${!can?'disabled':''} onchange="saveExpense(${e.id},{paid:this.checked})"></div>`).join('')}<p class="muted tiny">Enter written quotations and keep receipts separately. Mark paid only after payment is confirmed.</p></div>`}
function family(){let isAdmin=state.me.role==='admin';return `<div class="card"><h2>Family members</h2><table><thead><tr><th>Name</th><th>Access</th><th>Email</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.email)}</td></tr>`).join('')}</tbody></table><p class="muted tiny">Administrator: manages members. Coordinator and Family: can update tasks and arrangements. Viewer: can only read.</p></div>${isAdmin?`<div class="card"><h2>Invite a family member</h2><p class="muted">Create a separate login. The temporary password will be displayed once; share it privately.</p><form onsubmit="addMember(event)" class="formgrid"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Access</label><select name="role"><option value="family">Family — edit</option><option value="coordinator">Coordinator — edit</option><option value="viewer">Viewer — read only</option><option value="admin">Administrator — manage accounts</option></select></div><div><button class="primary" style="margin-top:22px">Create login</button></div></form><div id="invite-result"></div></div>`:''}<div class="card"><h2>Change my password</h2><form onsubmit="changePassword(event)" class="formgrid"><div class="field"><label>Current password</label><input type="password" name="old" required></div><div class="field"><label>New password (12+ characters)</label><input type="password" name="new" minlength="12" required></div><div><button class="secondary">Update password</button></div></form></div>`}
function activity(){return `<div class="card"><h2>Recent family updates</h2><table>${state.activity.length?state.activity.map(a=>`<tr><td><b>${esc(a.actor)}</b><div class="muted tiny">${esc(a.time)} UTC</div></td><td>${esc(a.description)}</td></tr>`).join(''):'<tr><td>No changes yet.</td></tr>'}</table></div>`}
async function mutate(path,method,data,redraw=true){try{await req(path,{method,body:JSON.stringify(data)});await refresh(redraw);notify('Saved')}catch(e){notify(e.message,true)}}
async function refresh(redraw=true){state=await req('/state');if(redraw)render()}
function patchTask(id,obj){mutate('/tasks/'+id,'PATCH',obj)}function saveSetting(k,v){mutate('/settings/'+encodeURIComponent(k),'PUT',{value:v},false)}function saveExpense(id,obj){mutate('/expenses/'+id,'PATCH',obj)}
async function addTask(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));await mutate('/tasks','POST',f)}
async function addMember(e){e.preventDefault();try{let data=await req('/members',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await refresh(false);document.getElementById('invite-result').innerHTML=`<div class="alert"><b>Login created.</b> Temporary password (shown only once): <code id="temppass">${esc(data.temporary_password)}</code><p>Ask this person to change the password after signing in. Share it using a secure private channel.</p></div>`}catch(err){notify(err.message,true)}}
async function changePassword(e){e.preventDefault();try{await req('/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();notify('Password changed')}catch(err){notify(err.message,true)}}
function copyDetails(){let s='Funeral arrangements for Louis Brown\n\n'+Object.entries(state.settings).map(([k,v])=>k+': '+(v||'To be confirmed')).join('\n');navigator.clipboard.writeText(s).then(()=>notify('Copied to clipboard')).catch(()=>notify('Copy unavailable',true))}
async function logout(){await req('/logout',{method:'POST',body:'{}'}).catch(()=>{});state=null;renderLogin()}
load();
</script></body></html>
