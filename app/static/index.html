/* Calm, accessible family-first design system */

const el=document.getElementById('app');let state=null,tab='overview',filter='all';let message='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'R '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
async function req(path,opts={}){let r=await fetch('/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function load(){try{state=await req('/state');render()}catch(e){state=null;renderLogin()}}
function notify(t,bad=false){message=t;let n=document.getElementById('notify');if(n){n.textContent=t;n.className='alert'+(bad?' error':'');n.classList.remove('hidden')}}
function renderLogin(){el.innerHTML=`<div class="card login"><h1 style="font-family:Georgia,serif">Louis Brown</h1><p class="muted">Private family funeral planner · Sign in</p><div id="err"></div><form id="login"><label>Email address</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%">Sign in</button></form><p class="muted tiny">Only invited family members can access this app. Contact the family administrator for an account.</p></div>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await req('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});load()}catch(err){document.getElementById('err').innerHTML='<div class="alert error">'+esc(err.message)+'</div>'}}}
function nav(t,name){return `<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${name}</button>`}
function render(){if(!state)return renderLogin();let me=state.me,done=state.tasks.filter(x=>x.done).length;el.innerHTML=`<header><div><div class="brand">✦ Louis Brown</div><div class="release">FAMILY PLANNER · NEW DESIGN v2</div><div class="sub">Together, one step at a time</div></div><div class="line"><span class="tiny">${esc(me.name)}</span><button class="secondary" onclick="logout()">Sign out</button></div></header><main class="wrap"><section class="hero"><div class="release" style="background:#e8d6b5;color:#594322;margin-bottom:17px">A CELEBRATION OF LIFE</div><h1>Honouring Dad, together.</h1><p>One simple place for our family to make arrangements, share responsibilities and support one another.</p></section><nav class="nav">${nav('overview','Start here')}${nav('tasks','All tasks')}${nav('arrangements','Service details')}${nav('budget','Budget')}${nav('gepf','GEPF claims')}${nav('family','Family & access')}${nav('activity','Recent updates')}</nav><div id="notify" class="hidden"></div><section id="content"></section></main><div class="footer">Made with care for the Brown family · A private space</div>`;let c=document.getElementById('content');if(tab==='overview')c.innerHTML=overview();if(tab==='tasks')c.innerHTML=tasks();if(tab==='arrangements')c.innerHTML=arrangements();if(tab==='budget')c.innerHTML=budget();if(tab==='gepf')c.innerHTML=gepf();if(tab==='family')c.innerHTML=family();if(tab==='activity')c.innerHTML=activity();}
const STAGES=[
{title:'1. First arrangements',cat:'First priorities',help:'Start here: hospital, funeral director, pastor, cover, burial or cremation and date.'},
{title:'2. Paperwork',cat:'Documents and paperwork',help:'Find the necessary IDs, medical notification, death certificate and burial order.'},
{title:'3. Funeral director',cat:'Funeral director and committal',help:'Confirm the quotation, casket or urn, viewing and burial or cremation arrangements.'},
{title:'4. Church and service',cat:'Church and service',help:'Set the service programme, prayers, worship, tributes and photographs.'},
{title:'5. Family and guests',cat:'Reception and communication',help:'Tell relatives, plan the gathering and arrange food and transport.'},
{title:'6. Honouring Dad',cat:'Personal memories',help:'Collect favourite memories, meaningful songs, photos and family messages.'},
{title:'7. The day before',cat:'Day before',help:'Confirm the people, places, presentation, music, food and transport.'},
{title:'8. Funeral day',cat:'Funeral day',help:'Use this as the on-the-day checklist for the coordinators.'},

];
function openStage(cat){tab='tasks';filter=cat;render();window.scrollTo(0,0)}
function overview(){
let all=state.tasks,d=all.filter(x=>x.done).length,t=all.length,can=state.me.role!=='viewer';
let urgent=all.filter(x=>x.category==='First priorities'&&!x.done).slice(0,6);
let mine=all.filter(x=>x.assignee===state.me.id&&!x.done).slice(0,5);
return `<div class="card priority"><h2>What should we do next?</h2><p class="muted">You do not have to organise everything at once. Start with these arrangements, then work through the sections below.</p>${urgent.length?urgent.map(x=>`<div class="action"><label><input type="checkbox" ${!can?'disabled':''} onchange="patchTask(${x.id},{done:this.checked})"><span>${esc(x.title)}</span></label><button class="secondary" onclick="openStage('First priorities')">Details</button></div>`).join(''):'<div class="alert">The first arrangements are marked complete. Continue with the paperwork and service planning below.</div>'}<div class="guide">Important: Confirm burial or cremation, the funeral director, the pastor, and the venue before announcing the final date. Ask the funeral director to explain the official paperwork. There is no need to upload private ID or medical documents here.</div></div>
<div class="stats"><div class="stat"><strong>${Math.round(d/(t||1)*100)}%</strong><span>Overall progress</span></div><div class="stat"><strong>${t-d}</strong><span>Outstanding tasks</span></div><div class="stat"><strong>${mine.length}</strong><span>My next tasks</span></div></div>
<div class="card" style="margin-top:16px"><h2>Funeral details at a glance</h2>${['Funeral date','Service time','Church / venue','Pastor','Funeral director','Reception venue'].map(k=>`<p><b>${esc(k)}:</b> ${esc(state.settings[k]||'Not confirmed yet')}</p>`).join('')}<button class="primary" onclick="tab='arrangements';render()">Update funeral details</button> <button class="secondary" onclick="copyDetails()">Copy for the family</button></div>
${mine.length?`<div class="card"><h2>Assigned to me</h2>${mine.map(x=>`<div class="action"><label><input type="checkbox" ${!can?'disabled':''} onchange="patchTask(${x.id},{done:this.checked})"> ${esc(x.title)}</label><button class="secondary" onclick="openStage(${JSON.stringify(x.category)})">Open</button></div>`).join('')}</div>`:''}
<div class="card"><h2>Our step-by-step funeral plan</h2><p class="muted">Each section tells you what needs doing. Tap a section to assign jobs, leave notes, and mark items complete.</p><div class="steps">${STAGES.map(st=>{let a=all.filter(x=>x.category===st.cat),completed=a.filter(x=>x.done).length;return `<div class="step"><h3>${esc(st.title)}</h3><span class="pill">${completed} of ${a.length} done</span><div class="progress"><div style="width:${100*completed/(a.length||1)}%"></div></div><p>${esc(st.help)}</p><button class="secondary" onclick="openStage(${JSON.stringify(st.cat)})">Open checklist →</button></div>`}).join('')}</div></div>
<div class="card"><h2>Keep the family involved</h2><p class="muted">Give each person a login and assign their responsibilities in All tasks. Everyone sees the same up-to-date information.</p><button class="secondary" onclick="tab='family';render()">Family members & logins</button></div>`;
}
function tasks(){let can=state.me.role!=='viewer',members=state.users;let list=state.tasks.filter(x=>filter==='all'||(filter==='mine'?x.assignee===state.me.id:filter==='open'?!x.done:x.category===filter));let cat=[...new Set(state.tasks.map(t=>t.category))];return `<div class="card"><h2>Shared checklists</h2><div class="line"><select onchange="filter=this.value;render()"><option value="all">All tasks</option><option value="mine" ${filter==='mine'?'selected':''}>Assigned to me</option><option value="open" ${filter==='open'?'selected':''}>Open only</option>${cat.map(x=>`<option ${filter===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><span class="muted tiny">Changes are shared with the whole family</span></div></div>${cat.map(category=>{let matches=list.filter(t=>t.category===category);return matches.length?`<div class="card group"><h3>${esc(category)} <span class="tag">${matches.filter(x=>x.done).length}/${matches.length}</span></h3>${matches.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} ${!can?'disabled':''} onchange="patchTask(${t.id},{done:this.checked})"><div><div class="task-title">${esc(t.title)}</div><textarea aria-label="Notes" placeholder="Notes / next steps" ${!can?'disabled':''} onchange="patchTask(${t.id},{notes:this.value})">${esc(t.notes)}</textarea></div><select ${!can?'disabled':''} onchange="patchTask(${t.id},{assignee:this.value?Number(this.value):null})"><option value="">Unassigned</option>${members.map(u=>`<option value="${u.id}" ${t.assignee===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`).join('')}</div>`:''}).join('')}${can?`<div class="card"><h2>Add a task</h2><form onsubmit="addTask(event)" class="formgrid"><div class="field"><label>Task description</label><input name="title" required minlength="2"></div><div class="field"><label>Category</label><select name="category">${cat.map(x=>`<option>${esc(x)}</option>`).join('')}<option>Other</option></select></div><button class="primary">Add task</button></form></div>`:''}`}
function arrangements(){let can=state.me.role!=='viewer';return `<div class="card"><h2>Funeral & service details</h2><p class="muted">Fill in confirmed information. Blank fields mean the decision is still pending.</p><div class="formgrid">${Object.entries(state.settings).map(([k,v])=>`<div class="field"><label>${esc(k)}</label>${k==='Notes'?`<textarea ${!can?'disabled':''} onchange="saveSetting(${JSON.stringify(k)},this.value)">${esc(v)}</textarea>`:`<input ${!can?'disabled':''} value="${esc(v)}" onchange="saveSetting(${JSON.stringify(k)},this.value)">`}</div>`).join('')}</div><p class="muted tiny">Information saves when you finish editing each field.</p><button class="secondary" onclick="copyDetails()">Copy arrangements for WhatsApp</button></div>`}
function gepf(){
const can=state.me.role!=='viewer',items=state.tasks.filter(x=>x.category==='GEPF benefit claims'),done=items.filter(x=>x.done).length;

<p><a target="_blank" rel="noopener noreferrer" href="https://www.gepf.co.za/forms/funeral-benefits-forms/">Official funeral claim forms ↗</a> &nbsp; · &nbsp; <a target="_blank" rel="noopener noreferrer" href="https://www.gepf.co.za/forms/death-benefits-forms/">Official death-benefit forms ↗</a></p>
<p class="muted">GEPF contact: <a href="tel:0800117669">0800 117 669</a></p></div>
<div class="card"><h2>GEPF checklist <span class="pill">${done}/${items.length} completed</span></h2>
${items.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} ${!can?'disabled':''} onchange="patchTask(${t.id},{done:this.checked})"><div><div class="task-title">${esc(t.title)}</div><textarea aria-label="Claim task notes" placeholder="Notes or next steps — avoid private ID and bank details" ${!can?'disabled':''} onchange="patchTask(${t.id},{notes:this.value})">${esc(t.notes)}</textarea></div><select ${!can?'disabled':''} onchange="patchTask(${t.id},{assignee:this.value?Number(this.value):null})"><option value="">Assign to...</option>${state.users.map(u=>`<option value="${u.id}" ${t.assignee===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`).join('')}
${items.length?'':'<p class="muted">This checklist will appear when the updated app container has started.</p>'}
</div>`;
}

function budget(){let can=state.me.role!=='viewer',estimated=state.expenses.reduce((a,x)=>a+x.estimate,0),actual=state.expenses.reduce((a,x)=>a+x.actual,0);return `<div class="stats"><div class="stat"><strong style="font-size:19px">${money(estimated)}</strong><span>Estimated</span></div><div class="stat"><strong style="font-size:19px">${money(actual)}</strong><span>Actual cost</span></div><div class="stat"><strong style="font-size:19px">${money(state.expenses.filter(x=>x.paid).reduce((a,x)=>a+x.actual,0))}</strong><span>Marked paid</span></div></div><div class="card" style="margin-top:16px"><h2>Expense tracker</h2><div class="budgetrow tiny"><b>Item</b><b>Estimate (R)</b><b>Actual (R)</b><b>Paid</b></div>${state.expenses.map(e=>`<div class="budgetrow"><b class="tiny">${esc(e.title)}</b><input aria-label="Estimate for ${esc(e.title)}" type="number" min="0" step="0.01" value="${e.estimate}" ${!can?'disabled':''} onchange="saveExpense(${e.id},{estimate:Number(this.value)})"><input aria-label="Actual for ${esc(e.title)}" type="number" min="0" step="0.01" value="${e.actual}" ${!can?'disabled':''} onchange="saveExpense(${e.id},{actual:Number(this.value)})"><input aria-label="Paid for ${esc(e.title)}" type="checkbox" ${e.paid?'checked':''} ${!can?'disabled':''} onchange="saveExpense(${e.id},{paid:this.checked})"></div>`).join('')}<p class="muted tiny">Enter written quotations and keep receipts separately. Mark paid only after payment is confirmed.</p></div>`}
function family(){let isAdmin=state.me.role==='admin';return `<div class="card"><h2>Family members</h2><table><thead><tr><th>Name</th><th>Access</th><th>Email</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.email)}</td></tr>`).join('')}</tbody></table><p class="muted tiny">Administrator: manages members. Coordinator and Family: can update tasks and arrangements. Viewer: can only read.</p></div>${isAdmin?`<div class="card"><h2>Invite a family member</h2><p class="muted">Create a separate login. The temporary password will be displayed once; share it privately.</p><form onsubmit="addMember(event)" class="formgrid"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Access</label><select name="role"><option value="family">Family — edit</option><option value="coordinator">Coordinator — edit</option><option value="viewer">Viewer — read only</option><option value="admin">Administrator — manage accounts</option></select></div><div><button class="primary" style="margin-top:22px">Create login</button></div></form><div id="invite-result"></div></div><div class="card"><h2>Reset a family member's password</h2><p class="muted">Administrators can set a new password for another family member. Their previous login sessions will be signed out.</p><form onsubmit="adminResetPassword(event)" class="formgrid"><div class="field"><label>Family member</label><select name="member_id" required><option value="">Choose family member</option>${state.users.filter(u=>u.id!==state.me.id).map(u=>`<option value="${u.id}">${esc(u.name)} (${esc(u.email)})</option>`).join('')}</select></div><div class="field"><label>New password (12+ characters)</label><input name="new_password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div><div><button class="primary">Reset password</button></div></form><p class="muted tiny">Share the password privately. It will not appear in the activity history.</p></div>`:''}<div class="card"><h2>Change my password</h2><form onsubmit="changePassword(event)" class="formgrid"><div class="field"><label>Current password</label><input type="password" name="old" required></div><div class="field"><label>New password (12+ characters)</label><input type="password" name="new" minlength="12" required></div><div><button class="secondary">Update password</button></div></form></div>`}
function activity(){return `<div class="card"><h2>Recent family updates</h2><table>${state.activity.length?state.activity.map(a=>`<tr><td><b>${esc(a.actor)}</b><div class="muted tiny">${esc(a.time)} UTC</div></td><td>${esc(a.description)}</td></tr>`).join(''):'<tr><td>No changes yet.</td></tr>'}</table></div>`}
async function mutate(path,method,data,redraw=true){try{await req(path,{method,body:JSON.stringify(data)});await refresh(redraw);notify('Saved')}catch(e){notify(e.message,true)}}
async function refresh(redraw=true){state=await req('/state');if(redraw)render()}
function patchTask(id,obj){mutate('/tasks/'+id,'PATCH',obj)}function saveSetting(k,v){mutate('/settings/'+encodeURIComponent(k),'PUT',{value:v},false)}function saveExpense(id,obj){mutate('/expenses/'+id,'PATCH',obj)}
async function addTask(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));await mutate('/tasks','POST',f)}
async function addMember(e){e.preventDefault();try{let data=await req('/members',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await refresh(false);document.getElementById('invite-result').innerHTML=`<div class="alert"><b>Login created.</b> Temporary password (shown only once): <code id="temppass">${esc(data.temporary_password)}</code><p>Ask this person to change the password after signing in. Share it using a secure private channel.</p></div>`}catch(err){notify(err.message,true)}}
async function adminResetPassword(e){e.preventDefault();let f=new FormData(e.target);let id=Number(f.get('member_id')),new_password=String(f.get('new_password')||'');if(!id||new_password.length<12)return notify('Choose a family member and enter a password of at least 12 characters',true);if(!confirm('Reset this family member’s password? Their active sessions will be signed out.'))return;try{await req('/members/'+id+'/reset-password',{method:'POST',body:JSON.stringify({new_password})});e.target.reset();notify('Password reset successfully. Share the new password privately.')}catch(err){notify(err.message,true)}}
async function changePassword(e){e.preventDefault();try{await req('/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();notify('Password changed')}catch(err){notify(err.message,true)}}
function copyDetails(){let s='Funeral arrangements for Louis Brown\n\n'+Object.entries(state.settings).map(([k,v])=>k+': '+(v||'To be confirmed')).join('\n');navigator.clipboard.writeText(s).then(()=>notify('Copied to clipboard')).catch(()=>notify('Copy unavailable',true))}
async function logout(){await req('/logout',{method:'POST',body:'{}'}).catch(()=>{});state=null;renderLogin()}
load();
</script></body></html>
