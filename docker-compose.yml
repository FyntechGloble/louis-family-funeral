services:
  family-memorial:
    image: ghcr.io/fyntechgloble/louis-family-funeral:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in Portainer environment variables}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in Portainer environment variables}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer environment variables}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?Set the exact HTTPS URL}
    volumes:
      - family_data:/data
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  family_data:
