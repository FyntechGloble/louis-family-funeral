# Use only when Nginx Proxy Manager shares the same Docker network.
# Replace 'proxy' with the actual existing proxy network before deploying.
services:
  louis-memorial:
    image: nginx:stable-alpine
    container_name: louis-memorial-booklet
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        wget -q -O /tmp/louis-memorial.html https://raw.githubusercontent.com/FyntechGloble/louis-family-funeral/main/memorial-booklet/index.html
        test -s /tmp/louis-memorial.html
        mv /tmp/louis-memorial.html /usr/share/nginx/html/index.html
        exec nginx -g 'daemon off;'
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  proxy:
    external: true
    name: proxy
